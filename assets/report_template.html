<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{REPORT_TITLE}}</title>
<style>
  :root {
    --bg: #f7f8fa;
    --card-bg: #ffffff;
    --text-primary: #1a1a2e;
    --text-secondary: #6b7280;
    --text-muted: #9ca3af;
    --border: #e5e7eb;
    --accent: #2563eb;
    --accent-light: #eff6ff;
    --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    --shadow-hover: 0 4px 12px rgba(0,0,0,0.08), 0 2px 4px rgba(0,0,0,0.04);
    --radius: 10px;
    --cat-gene: #ef4444;
    --cat-gene-bg: #fef2f2;
    --cat-seq: #8b5cf6;
    --cat-seq-bg: #f5f3ff;
    --cat-protein: #f59e0b;
    --cat-protein-bg: #fffbeb;
    --cat-synbio: #10b981;
    --cat-synbio-bg: #ecfdf5;
    --cat-tool: #3b82f6;
    --cat-tool-bg: #eff6ff;
    --cat-rna: #ec4899;
    --cat-rna-bg: #fdf2f8;
    --cat-struct: #14b8a6;
    --cat-struct-bg: #f0fdfa;
    --cat-other: #6b7280;
    --cat-other-bg: #f9fafb;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    line-height: 1.6;
    padding: 24px;
  }
  .container { max-width: 1100px; margin: 0 auto; }

  /* Header */
  .header {
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 32px;
    margin-bottom: 24px;
    box-shadow: var(--shadow);
  }
  .header h1 {
    font-size: 26px;
    font-weight: 700;
    margin-bottom: 8px;
    letter-spacing: -0.02em;
  }
  .header .subtitle {
    color: var(--text-secondary);
    font-size: 14px;
    margin-bottom: 20px;
  }
  .stats {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
  }
  .stat-item {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .stat-num {
    font-size: 28px;
    font-weight: 700;
    color: var(--accent);
  }
  .stat-label {
    font-size: 13px;
    color: var(--text-secondary);
  }

  /* Category filter */
  .filter-bar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 24px;
    align-items: center;
  }
  .filter-label {
    font-size: 13px;
    color: var(--text-muted);
    margin-right: 4px;
  }
  .filter-tag {
    padding: 5px 14px;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
    border: 1.5px solid var(--border);
    background: var(--card-bg);
    color: var(--text-secondary);
    transition: all 0.2s ease;
    user-select: none;
  }
  .filter-tag:hover { border-color: var(--accent); color: var(--accent); }
  .filter-tag.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  /* Cards */
  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: var(--shadow);
    border: 1px solid transparent;
    transition: all 0.2s ease;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .card:hover {
    box-shadow: var(--shadow-hover);
    border-color: var(--border);
    transform: translateY(-1px);
  }
  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }
  .cat-badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
  }
  .card-date {
    font-size: 12px;
    color: var(--text-muted);
    white-space: nowrap;
  }
  .card-title {
    font-size: 15px;
    font-weight: 600;
    line-height: 1.5;
  }
  .card-title a {
    color: var(--text-primary);
    text-decoration: none;
    transition: color 0.15s;
  }
  .card-title a:hover { color: var(--accent); }
  .card-summary {
    font-size: 13.5px;
    color: var(--text-secondary);
    line-height: 1.6;
  }
  .card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: auto;
    padding-top: 8px;
  }
  .card-source {
    font-size: 12px;
    color: var(--text-muted);
  }
  .card-link {
    font-size: 12px;
    color: var(--accent);
    text-decoration: none;
    font-weight: 500;
  }
  .card-link:hover { text-decoration: underline; }

  /* Category colors */
  .cat-gene-editing { color: var(--cat-gene); background: var(--cat-gene-bg); }
  .cat-sequencing { color: var(--cat-seq); background: var(--cat-seq-bg); }
  .cat-protein { color: var(--cat-protein); background: var(--cat-protein-bg); }
  .cat-synbio { color: var(--cat-synbio); background: var(--cat-synbio-bg); }
  .cat-tools { color: var(--cat-tool); background: var(--cat-tool-bg); }
  .cat-rna { color: var(--cat-rna); background: var(--cat-rna-bg); }
  .cat-structure { color: var(--cat-struct); background: var(--cat-struct-bg); }
  .cat-other { color: var(--cat-other); background: var(--cat-other-bg); }

  /* 干货口径徽章（与新闻/资讯周报区分） */
  .dry-badge {
    display: inline-block;
    margin-left: 10px;
    padding: 2px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    color: #b45309;
    background: #fef3c7;
    border: 1px solid #fde68a;
    vertical-align: middle;
  }

  /* Footer */
  .footer {
    text-align: center;
    padding: 32px 0 16px;
    color: var(--text-muted);
    font-size: 12px;
  }

  /* Empty state */
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
  }

  @media (max-width: 640px) {
    body { padding: 12px; }
    .header { padding: 20px; }
    .cards-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <h1>{{REPORT_TITLE}}<span class="dry-badge">纯干货 · 非资讯</span></h1>
    <div class="subtitle">{{DATE_RANGE}} | 干货口径：知识科普/实验技巧/工具/方法学教程 | 已排除行业动态·会议·广告营销</div>
    <div class="stats">
      <div class="stat-item">
        <span class="stat-num">{{TOTAL_COUNT}}</span>
        <span class="stat-label">条资讯</span>
      </div>
      <div class="stat-item">
        <span class="stat-num">{{CAT_COUNT}}</span>
        <span class="stat-label">个分类</span>
      </div>
      <div class="stat-item">
        <span class="stat-num">{{SOURCE_COUNT}}</span>
        <span class="stat-label">个来源</span>
      </div>
    </div>
  </div>

  <div class="filter-bar">
    <span class="filter-label">筛选：</span>
    <span class="filter-tag active" onclick="filterCards('all')">全部</span>
    {{FILTER_TAGS}}
  </div>

  <div class="cards-grid" id="cardsGrid">
    {{CARDS_HTML}}
  </div>

  <div class="footer">
    由 WorkBuddy 自动生成 | {{GENERATED_AT}}
  </div>

</div>

<script>
function filterCards(category) {
  const cards = document.querySelectorAll('.card');
  const tags = document.querySelectorAll('.filter-tag');
  tags.forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');

  cards.forEach(card => {
    if (category === 'all' || card.dataset.category === category) {
      card.style.display = '';
    } else {
      card.style.display = 'none';
    }
  });
}
</script>
</body>
</html>
