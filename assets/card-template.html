<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小红书卡片模板 · 10 风格</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #e6e6e6; font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
  .stage { padding: 48px 24px; }
  .group-title { text-align: center; font-size: 20px; color: #444; letter-spacing: .2em; margin-bottom: 28px; }
  .card-row { display: flex; flex-wrap: wrap; gap: 36px; justify-content: center; }
  .card { width: 1080px; height: 1440px; overflow: hidden; position: relative; box-shadow: 0 12px 40px rgba(0,0,0,.16); }
  .card .card-index { position: absolute; right: 26px; bottom: 22px; font-size: 16px; letter-spacing: .1em; opacity: .45; z-index: 5; }

  /* ============ 主题变量系统（默认 t-pentagram） ============ */
  .card {
    --bg: #fff; --ink: #1a1a1a; --accent: #E63946; --accent2: #E63946;
    --line: #1a1a1a; --soft: #f5f5f5; --soft2: #fff;
    --radius: 0px; --shadow: none; --pad: 54px 56px 46px;
    --font-d: inherit; --font-b: inherit; --weight-d: 800; --weight-b: 400;
    --num-style: italic; --tag-radius: 0px; --sep-w: 2px;
    background: var(--bg); color: var(--ink); padding: var(--pad);
    display: flex; flex-direction: column;
  }
  .card, .card * { font-family: var(--font-b); }
  .card .c-h1, .card .step-title, .card .c-block-t, .card .cta-btn { font-family: var(--font-d); }

  /* ============ 10 种风格主题 ============ */
  .t-build     { --bg:#fbfaf7; --ink:#2b2a26; --accent:#b08a4f; --line:#e2dccb; --soft:#fff; --soft2:#fbfaf7; --weight-d:500; --weight-b:400; --pad:72px 80px 52px; }
  .t-takram    { --bg:#f6f2ea; --ink:#3d3a33; --accent:#7a8a72; --line:#e0d9c8; --soft:#fff; --radius:20px; --shadow:0 4px 18px rgba(120,130,110,.08); --pad:52px 60px 46px; }
  .t-muller    { --bg:#fff; --ink:#000; --accent:#000; --line:#000; --soft:#f2f2f2; --weight-d:900; --weight-b:700; --num-style:normal; --pad:48px 52px 40px; }
  .t-fathom    { --bg:#f4f6f8; --ink:#1b2a41; --accent:#E76F51; --line:#cdd6e0; --soft:#fff; --radius:8px; --sep-w:1px; }
  .t-ia        { --bg:#fff; --ink:#111; --accent:#3B6EA5; --line:#e8e8e8; --soft:#fafafa; --weight-d:600; --sep-w:1px; }
  .t-sagmeister{ --bg:#faf6e9; --ink:#202020; --accent:#E63946; --accent2:#1E5AA8; --line:#e6dbbd; --soft:#fff; --radius:14px; --sep-w:1px; --weight-d:800; }
  .t-hara      { --bg:#f4f1ea; --ink:#2a241e; --accent:#C0392B; --line:#d9d1c3; --soft:#efe9dd; --pad:70px 72px 50px; }
  .t-jetset    { --bg:#fff; --ink:#0a0a0a; --accent:#ffd400; --line:#0a0a0a; --soft:#fff; --weight-d:900; --weight-b:600; --num-style:normal; --tag-radius:0px; }
  .t-boom      { --bg:#faf7f2; --ink:#3d2f24; --accent:#8a6d4b; --line:#ddd2c0; --soft:#f2ece2; --font-d:Georgia,"Source Serif","SimSun",serif; --font-b:Georgia,"SimSun",serif; --sep-w:1px; }
  /* ---------- 布局级差异风格（11-20） ---------- */
  .t-dashboard { --bg:#0e1626; --ink:#e8eefb; --accent:#4dd0e1; --accent2:#ffd166; --line:#2a3a55; --soft:#16233a; --soft2:#132036; --radius:10px; --weight-d:800; --weight-b:400; --pad:48px 52px 42px; --sep-w:1px; }
  .t-notebook  { --bg:#fdf9ee; --ink:#4a4038; --accent:#2d6cdf; --line:#d8cdb4; --soft:#fffdf5; --radius:6px; --weight-d:700; --weight-b:400; --font-d:"Kaiti SC","STKaiti","楷体",serif; --font-b:"Kaiti SC","STKaiti","楷体",serif; --pad:56px 60px 48px; --sep-w:1px; }
  .t-magazine  { --bg:#fff; --ink:#1a1a1a; --accent:#b02e26; --line:#c9c9c9; --soft:#f7f4ee; --weight-d:800; --weight-b:400; --font-d:Georgia,"Source Serif","SimSun",serif; --font-b:Georgia,"SimSun",serif; --sep-w:1px; --pad:64px 64px 50px; }
  .t-minimal   { --bg:#fafafa; --ink:#111; --accent:#d97706; --line:#e5e5e5; --soft:#fff; --weight-d:800; --weight-b:400; --pad:84px 88px 60px; --sep-w:1px; }
  .t-newspaper { --bg:#f8f5ef; --ink:#2b2620; --accent:#7a1f1f; --line:#b9ad99; --soft:#f1ece2; --weight-d:800; --weight-b:400; --font-d:Georgia,"Source Serif","SimSun",serif; --font-b:Georgia,"SimSun",serif; --sep-w:1px; --pad:50px 54px 42px; }
  .t-neon      { --bg:#0b0f1a; --ink:#dfe7f5; --accent:#39FF14; --accent2:#FF2D95; --line:#2a3550; --soft:#111827; --soft2:#101a2e; --radius:10px; --weight-d:800; --weight-b:400; --pad:52px 56px 44px; --sep-w:1px; }
  .t-sketch    { --bg:#fffdf5; --ink:#3a3a3a; --accent:#2d6cdf; --line:#b9b9b9; --soft:#fffaf0; --radius:0px; --weight-d:700; --weight-b:400; --font-d:"Kaiti SC","STKaiti","楷体",serif; --font-b:"Kaiti SC","STKaiti","楷体",serif; --pad:56px 60px 46px; --sep-w:2px; }
  .t-timeline  { --bg:#fff; --ink:#1a1a1a; --accent:#2563eb; --line:#d8dde6; --soft:#f5f7fb; --weight-d:800; --weight-b:400; --pad:50px 56px 44px; --sep-w:1px; }
  .t-cards     { --bg:#eef1f6; --ink:#1f2937; --accent:#f59e0b; --line:#dfe3ea; --soft:#fff; --soft2:#fff; --radius:16px; --weight-d:800; --weight-b:400; --pad:50px 52px 44px; --sep-w:0px; --shadow:0 6px 24px rgba(30,40,60,.10); }
  .t-split     { --bg:#F7F5F0; --ink:#0F172A; --accent:#22D3EE; --accent2:#FBBF24; --line:#0F172A; --soft:#0F172A; --soft2:#fff; --weight-d:900; --weight-b:500; --pad:56px 60px 46px; --sep-w:2px; --radius:0px; }


  /* ============ 通用组件（基于变量） ============ */
  .c-label { font-size: 20px; font-weight: 600; letter-spacing: .14em; }
  .c-label::before { content: "#"; color: var(--accent); }
  .c-tags { display: flex; gap: 10px; flex-wrap: wrap; }
  .c-tag { font-size: 21px; padding: 9px 20px; border: var(--sep-w) solid var(--ink); font-weight: 600; border-radius: var(--tag-radius); color: var(--ink); background: transparent; }
  .c-tag:first-child { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .c-h1 { font-size: 92px; font-weight: var(--weight-d); line-height: 1.12; letter-spacing: .01em; font-style: normal; }
  .c-h1 b, .hl { color: var(--accent); font-weight: inherit; }
  .c-sub { font-size: 30px; color: var(--ink); opacity: .72; font-weight: 400; letter-spacing: .04em; }
  .c-block { padding: 32px 36px; border-top: var(--sep-w) solid var(--line); }
  .c-block-t { font-size: 31px; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; gap: 12px; }
  .c-block-t::before { content: ""; width: 12px; height: 28px; background: var(--accent); border-radius: var(--radius); flex: none; }
  .c-block-p { font-size: 29px; color: var(--ink); opacity: .85; line-height: 1.6; }
  .c-block-p b { color: var(--accent); font-weight: 700; }

  /* STEP 标识 */
  .step-no { display: inline-block; font-size: 24px; font-weight: 800; color: var(--accent); letter-spacing: .14em; border: 2.5px solid var(--accent); padding: 8px 18px; font-style: normal; }
  .pill { border-radius: 999px; font-size: 18px; padding: 6px 16px; }

  /* 步骤块 */
  .step-block { padding: 22px 0; border-top: var(--sep-w) solid var(--line); }
  .step-title { font-size: 40px; font-weight: 700; margin-bottom: 14px; display: flex; align-items: center; gap: 12px; }
  .step-title::before { content: ""; width: 12px; height: 28px; background: var(--accent); border-radius: var(--radius); flex: none; }
  .step-desc { font-size: 30px; color: var(--ink); opacity: .85; line-height: 1.6; }
  .step-desc b { color: var(--accent); }
  .step-line { display: flex; gap: 12px; align-items: baseline; font-size: 29px; line-height: 1.55; padding: 19px 0; border-bottom: 1px dashed var(--line); color: var(--ink); opacity: .9; }
  .step-line b { min-width: 34px; color: var(--accent); font-weight: 700; }

  /* 参数卡 */
  .param-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  .param { border: var(--sep-w) solid var(--ink); padding: 24px 10px; text-align: center; border-radius: var(--radius); }
  .param .pv { font-size: 46px; font-weight: 800; color: var(--accent); line-height: 1.1; font-style: var(--num-style); font-variant-numeric: tabular-nums; }
  .param .pl { font-size: 20px; color: var(--ink); opacity: .65; margin-top: 8px; letter-spacing: .04em; }

  /* 优点格 */
  .why-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
  .why { border-top: 4px solid var(--accent); padding: 20px 8px 8px; }
  .why .wn { font-size: 26px; font-weight: 800; margin-bottom: 8px; }
  .why .wd { font-size: 22px; color: var(--ink); opacity: .65; line-height: 1.45; }

  /* 五步目录 */
  .step-dir { display: flex; gap: 18px; padding: 20px 0; border-bottom: 1px dashed var(--line); align-items: baseline; }
  .step-dir .dn { font-size: 27px; font-weight: 800; color: var(--accent); min-width: 88px; font-style: var(--num-style); }
  .step-dir .dt { font-size: 29px; font-weight: 700; min-width: 170px; }
  .step-dir .dd { font-size: 24px; color: var(--ink); opacity: .6; line-height: 1.4; }

  /* 速记条 */
  .recape { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .recape-item { border: var(--sep-w) solid var(--ink); padding: 22px 8px; text-align: center; border-radius: var(--radius); }
  .recape-item .r-n { font-size: 32px; font-weight: 800; color: var(--accent); font-style: var(--num-style); }
  .recape-item .r-t { font-size: 20px; margin-top: 6px; letter-spacing: .06em; opacity: .8; }

  /* 提示条 */
  .tip { border: 2px solid var(--accent); background: color-mix(in srgb, var(--accent) 7%, var(--soft)); padding: 22px 28px; font-size: 27px; line-height: 1.55; color: var(--ink); border-radius: var(--radius); }
  .tip b { color: var(--accent); }

  /* 配图 */
  .note-row { display: flex; gap: 14px; align-items: flex-start; padding: 31px 0; font-size: 30px; line-height: 1.55; border-bottom: 1px dashed var(--line); }
  .note-bullet { color: var(--accent); font-size: 32px; line-height: 1; }
  .t-muller .note-row { padding: 35px 0; }
  .t-muller .tip { padding: 30px 32px; }
  .fig-wrap { margin: 18px 0 6px; }
  .t-muller .fig-wrap { margin-top: 26px; }
  .t-boom .fig-wrap { margin-top: 26px; }
  .fig { display: flex; align-items: center; justify-content: center; border: var(--sep-w) solid var(--line); background: var(--soft2); padding: 10px; border-radius: var(--radius); }
  .fig-row { gap: 14px; }
  .fig-col { flex-direction: column; gap: 12px; }
  .fig-item { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; border: 1px solid var(--line); background: var(--soft2); border-radius: var(--radius); }
  .fig-item img, .fig img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .fig-cap { text-align: center; font-size: 20px; opacity: .5; margin-top: 12px; letter-spacing: .04em; }

  /* 封面 / 封底 */
  .split-moon, .split-sun { display: none; }
  .cover-only { position: relative; }
  .cover-only .cover-main { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .cover-only .cover-main .c-h1 { font-size: 96px; }
  .cta-btn { display: inline-block; background: var(--accent); color: #fff; font-size: 44px; font-weight: 800; padding: 24px 64px; letter-spacing: .2em; border-radius: var(--radius); }
  .logo-ige { width: 230px; height: auto; margin: 40px auto 0; display: block; }


  /* ============ 布局级风格签名（11-20） ============ */
  /* 11 Dashboard 数据大屏：暗色 + 网格线 + 模块化参数卡 */
  .t-dashboard { background-image: linear-gradient(rgba(77,208,225,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(77,208,225,.05) 1px, transparent 1px); background-size: 44px 44px; }
  .t-dashboard .c-block { background: rgba(19,32,54,.72); border-color: var(--line); border-radius: var(--radius); margin-bottom: 16px; }
  .t-dashboard .c-block-t::before { background: var(--accent); box-shadow: 0 0 12px var(--accent); }
  .t-dashboard .step-block { background: rgba(19,32,54,.72); border-radius: var(--radius); border-top: none; padding: 24px 28px; }
  .t-dashboard .step-title::before { background: var(--accent); box-shadow: 0 0 12px var(--accent); }
  .t-dashboard .param { background: #132036; border-color: var(--accent); box-shadow: 0 0 16px rgba(77,208,225,.15); }
  .t-dashboard .param .pv { color: var(--accent2); text-shadow: 0 0 14px rgba(255,209,102,.4); }
  .t-dashboard .tip { background: rgba(19,32,54,.72); }
  .t-dashboard .c-tag { border-color: var(--line); }
  .t-dashboard .c-tag:first-child { background: var(--accent); border-color: var(--accent); color: #081018; }
  .t-dashboard .fig { background: rgba(19,32,54,.72); }
  .t-dashboard .cta-btn { background: var(--accent); color: #081018; }

  /* 12 Notebook 手账：横线纸 + 楷体 + 胶带便签 */
  .t-notebook { background-image: repeating-linear-gradient(transparent, transparent 47px, rgba(45,108,223,.18) 47px, rgba(45,108,223,.18) 48px); }
  .t-notebook .c-block { background: rgba(255,253,245,.85); border: 1px solid var(--line); border-radius: var(--radius); position: relative; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(74,64,56,.06); }
  .t-notebook .c-block::before { content: ""; position: absolute; top: -9px; left: 24px; width: 86px; height: 20px; background: rgba(255,213,79,.65); transform: rotate(-2deg); }
  .t-notebook .c-block-t::before { width: 16px; height: 16px; border-radius: 50%; background: var(--accent); }
  .t-notebook .step-block { background: rgba(255,253,245,.85); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px 26px; margin-bottom: 16px; position: relative; }
  .t-notebook .step-block::before { content: ""; position: absolute; top: -9px; left: 24px; width: 70px; height: 18px; background: rgba(255,213,79,.6); transform: rotate(2deg); }
  .t-notebook .step-title::before { width: 16px; height: 16px; border-radius: 50%; background: var(--accent); }
  .t-notebook .c-tag { border: 2px dashed var(--accent); border-radius: 999px; color: var(--accent); }
  .t-notebook .c-tag:first-child { background: var(--accent); color: #fff; border-style: solid; }
  .t-notebook .param { background: #fff; border: 2px dashed var(--line); }
  .t-notebook .param .pv { color: var(--accent); }
  .t-notebook .tip { border-style: dashed; }
  .t-notebook .recape-item { background: #fff; border: 2px dashed var(--line); }

  /* 13 Magazine 杂志：衬线大标题 + 首字下沉 + 页眉页脚线 */
  .t-magazine .c-h1 { font-family: var(--font-d); letter-spacing: .02em; }
  .t-magazine .c-block { border-top: 3px double var(--line); }
  .t-magazine .c-block-t { font-family: var(--font-d); }
  .t-magazine .c-block-t::before { width: 34px; height: 3px; background: var(--accent); }
  .t-magazine .c-block-p::first-letter { font-family: var(--font-d); font-size: 64px; font-weight: 800; color: var(--accent); float: left; line-height: .9; margin: 2px 10px 0 0; }
  .t-magazine .step-block { border-top: 3px double var(--line); }
  .t-magazine .step-title { font-family: var(--font-d); }
  .t-magazine .step-title::before { width: 34px; height: 3px; background: var(--accent); }
  .t-magazine .step-desc::first-letter { font-family: var(--font-d); font-size: 56px; font-weight: 800; color: var(--accent); float: left; line-height: .9; margin: 2px 8px 0 0; }
  .t-magazine .fig-cap { font-style: italic; }
  .t-magazine .step-no { font-family: var(--font-d); border-width: 1px; letter-spacing: .1em; }

  /* 14 Minimal 单焦点：超大标题 + 极简，每页一个焦点 */
  .t-minimal .c-h1 { font-size: 96px; }
  .t-minimal .c-h1, .t-minimal .step-title { letter-spacing: -.01em; }
  .t-minimal .c-block { border-top: none; padding: 26px 0; }
  .t-minimal .c-block-t { font-size: 30px; font-weight: 600; }
  .t-minimal .c-block-t::before { display: none; }
  .t-minimal .c-block-p { font-size: 33px; opacity: .92; }
  .t-minimal .step-block { border-top: none; padding: 22px 0; }
  .t-minimal .step-title { font-size: 44px; }
  .t-minimal .step-title::before { display: none; }
  .t-minimal .step-desc { font-size: 33px; }
  .t-minimal .param { border: none; border-bottom: 1px solid var(--line); padding: 18px 4px; }
  .t-minimal .param .pv { font-size: 54px; }
  .t-minimal .step-line { font-size: 31px; }
  .t-minimal .tip { border: none; border-left: 4px solid var(--accent); background: var(--soft); }
  .t-minimal .fig { border: none; }
  .t-minimal .c-tag { border-radius: 999px; }
  .t-minimal .step-dir { padding: 24px 0; }

  /* 15 Newspaper 报纸：旧纸色 + 栏线 + 头条感 */
  .t-newspaper .c-h1 { font-family: var(--font-d); font-weight: 900; }
  .t-newspaper .c-block { border-top: 3px double var(--line); }
  .t-newspaper .c-block-t { font-family: var(--font-d); font-size: 28px; }
  .t-newspaper .c-block-t::before { width: 24px; height: 24px; border-radius: 50%; background: var(--accent); }
  .t-newspaper .c-block-p { font-family: var(--font-d); font-size: 26px; line-height: 1.85; }
  .t-newspaper .step-block { border-top: 3px double var(--line); }
  .t-newspaper .step-title { font-family: var(--font-d); }
  .t-newspaper .step-title::before { width: 24px; height: 24px; border-radius: 50%; background: var(--accent); }
  .t-newspaper .step-desc { font-family: var(--font-d); font-size: 27px; line-height: 1.85; }
  .t-newspaper .step-line { font-family: var(--font-d); font-size: 26px; padding: 22px 0; }
  .t-newspaper .c-tag { border-radius: 0; }
  .t-newspaper .fig-cap { font-family: var(--font-d); font-style: italic; }
  .t-newspaper .param .pv { font-family: var(--font-d); font-size: 42px; }

  /* 16 Neon 霓虹：暗底 + 发光描边 */
  .t-neon .c-h1 b, .t-neon .hl { color: var(--accent); text-shadow: 0 0 18px rgba(57,255,20,.55), 0 0 40px rgba(57,255,20,.25); }
  .t-neon .c-block { background: rgba(17,24,39,.6); border-color: var(--line); border-radius: var(--radius); margin-bottom: 14px; }
  .t-neon .c-block-t::before { background: var(--accent2); box-shadow: 0 0 14px var(--accent2); }
  .t-neon .step-block { background: rgba(17,24,39,.6); border-radius: var(--radius); border-top: none; padding: 22px 26px; }
  .t-neon .step-title::before { background: var(--accent2); box-shadow: 0 0 14px var(--accent2); }
  .t-neon .step-desc b { color: var(--accent); text-shadow: 0 0 14px rgba(57,255,20,.5); }
  .t-neon .step-line b { color: var(--accent2); }
  .t-neon .step-no { border-color: var(--accent); color: var(--accent); text-shadow: 0 0 12px rgba(57,255,20,.6); box-shadow: 0 0 16px rgba(57,255,20,.15); }
  .t-neon .param { background: #101a2e; border-color: var(--line); box-shadow: 0 0 18px rgba(255,45,149,.12); }
  .t-neon .param .pv { color: var(--accent); text-shadow: 0 0 16px rgba(57,255,20,.55); }
  .t-neon .tip { background: rgba(17,24,39,.7); border-color: var(--accent2); }
  .t-neon .c-tag { border-color: var(--line); }
  .t-neon .c-tag:first-child { background: var(--accent2); border-color: var(--accent2); color: #fff; box-shadow: 0 0 16px rgba(255,45,149,.4); }
  .t-neon .cta-btn { background: var(--accent); color: #0b0f1a; box-shadow: 0 0 24px rgba(57,255,20,.4); }
  .t-neon .recape-item { background: rgba(17,24,39,.6); }
  .t-neon .recape-item .r-n { color: var(--accent); text-shadow: 0 0 12px rgba(57,255,20,.5); }

  /* 17 Sketch 手绘：纸色 + 手绘虚线边框 + 手写体 */
  .t-sketch .c-block { border: 2.5px dashed var(--line); border-radius: 14px 8px 16px 10px; background: rgba(255,250,240,.8); margin-bottom: 16px; }
  .t-sketch .c-block-t::before { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); }

/* ============ 渲染 ============ */
function blockHTML(b) {
  if (b.why) return `<div class="c-block" data-tag="${b.t || ''}"><div class="c-block-t">三大优势</div><div class="why-grid">${b.why.map(w => `<div class="why"><div class="wn">${w[0]}</div><div class="wd">${w[1]}</div></div>`).join('')}</div></div>`;
  if (b.dir) return `<div class="c-block" data-tag="${b.t || ''}"><div class="c-block-t">五步流程</div>${b.dir.map(d => `<div class="step-dir"><div class="dn">STEP ${d[0]}</div><div class="dt">${d[1]}</div><div class="dd">${d[2]}</div></div>`).join('')}</div>`;
  if (b.recape) { const t = b.title ? `<div class="c-block-t">${b.title}</div>` : ''; return `<div class="c-block" data-tag="${b.t || ''}"><div class="recape">${b.recape.map(r => `<div class="recape-item"><div class="r-n">${r[0]}</div><div class="r-t">${r[1]}</div></div>`).join('')}</div>${t}</div>`; }
  if (b.step) return `<div class="step-block"><div class="step-title">${b.step.t}</div><div class="step-desc">${b.step.d}</div></div>`;
  if (b.params) return `<div class="c-block" data-tag="${b.t || ''}"><div class="c-block-t">关键参数</div><div class="param-grid">${b.params.map(p => `<div class="param"><div class="pv">${p[0]}</div><div class="pl">${p[1]}</div></div>`).join('')}</div></div>`;
  if (b.tip) return `<div class="c-block" style="padding:16px 0" data-tag="${b.t || ''}"><div class="tip">${b.tip}</div></div>`;
  if (b.faq) return `<div class="c-block" data-tag="${b.t || ''}"><div class="c-block-t">常见问题</div>${b.faq.map(f => `<div class="tip" style="margin-bottom:18px"><b>${f[0]}</b><br>${f[1]}</div>`).join('')}</div>`;
  if (b.notes) return `<div class="c-block" data-tag="${b.t || ''}"><div class="c-block-t">${b.t}</div>${b.notes.map(n => `<div class="note-row"><span class="note-bullet">◆</span><div>${n}</div></div>`).join('')}</div>`;
  if (b.lines) return `<div class="c-block" style="margin-bottom:18px" data-tag="${b.t || ''}"><div class="c-block-t">${b.t}</div>${b.lines.map(l => `<div class="step-line"><b>${l[0]}</b><div>${l[1]}</div></div>`).join('')}</div>`;
  if (b.imgs) { const items = b.imgs.map(src => `<div class="fig-item"><img src="${src}"></div>`).join(''); const cap = b.cap ? `<div class="fig-cap">${b.cap}</div>` : ''; const cls = b.col ? 'fig fig-col' : 'fig fig-row'; return `<div class="fig-wrap"><div class="${cls}" style="height:${b.h}px">${items}</div>${cap}</div>`; }
  if (b.img) { const cap = b.cap ? `<div class="fig-cap">${b.cap}</div>` : ''; return `<div class="fig-wrap"><div class="fig" style="height:${b.h}px"><img src="${b.img}"></div>${cap}</div>`; }
  return `<div class="c-block" data-tag="${b.t || ''}"><div class="c-block-t">${b.t}</div><div class="c-block-p">${b.p}</div></div>`;
}

function coverCard(S, p, i, total) {
  return `<div class="card ${S.cls} cover-only">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:30px">
      <div class="c-tags">${p.tags.map(t => `<span class="c-tag">${t}</span>`).join('')}</div>
      <span class="c-label">技术 · 干货</span>
    </div>
    <div class="cover-main">
      <div class="c-sub" style="margin-bottom:22px">${p.sub}</div>
      <div class="c-h1">${p.h1}</div>
      <div class="c-sub" style="margin-top:36px">${p.sub2}</div>
    </div>
    <span class="split-moon"></span>
    <span class="split-sun"></span>
    <span class="card-index">${i}/${total}</span>
  </div>`;
}

function endCard(S, p, i, total) {
  return `<div class="card ${S.cls} cover-only end-cover">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:30px">
      <div class="c-tags">${p.tags.map(t => `<span class="c-tag">${t}</span>`).join('')}</div>
      <span class="c-label">技术 · 干货</span>
    </div>
    <div class="cover-main" style="text-align:center">
      <div class="c-sub" style="margin-bottom:22px;letter-spacing:.32em">FIN · 5 步完结</div>
      <div class="c-h1">感谢阅读<br><span class="hl">感谢关注</span></div>
      <img class="logo-ige" src="imgs/logo-ige.png" alt="品牌 LOGO">
      <div style="margin-top:32px"><div class="cta-btn">＋ 关注</div></div>
    </div>
    <div style="text-align:center;font-size:22px;color:var(--ink);opacity:.55;letter-spacing:.18em">${p.foot}</div>
    <span class="card-index">${i}/${total}</span>
  </div>`;
}

function stepCard(S, p, i, total) {
  const no = String(p.step).padStart(2, '0');
  return `<div class="card ${S.cls}">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:26px">
      <span class="step-no">STEP ${no} / 05</span>
      <span class="pill c-tag">${i}/${total}</span>
    </div>
    <div class="c-sub" style="margin-bottom:10px">${p.label}</div>
    <div class="c-h1" style="font-size:60px;margin-bottom:24px">${p.title}</div>
    ${p.blocks.map(blockHTML).join('')}
    <span class="card-index">${i}/${total}</span>
  </div>`;
}

function contentCard(S, p, i, total) {
  return `<div class="card ${S.cls}">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px">
      <span class="c-label">${p.label}</span>
      <span class="pill c-tag">${i}/${total}</span>
    </div>
    <div class="c-h1" style="font-size:60px;margin-bottom:24px">${p.title}</div>
    ${p.blocks.map(blockHTML).join('')}
    <span class="card-index">${i}/${total}</span>
  </div>`;
}

/* ============ 入口 ============ */
const stage = document.getElementById('stage');
const params = new URLSearchParams(location.search);
const styleId = params.get('style');
const allStyles = params.has('all-styles');

function renderAll(S) {
  const group = document.createElement('div');
  group.className = 'group';
  group.innerHTML = `<div class="group-title">${S.name} — ${S.desc}</div><div class="card-row"></div>`;
  const row = group.querySelector('.card-row');
  const total = PAGES.length;
  PAGES.forEach((p, i) => {
    let html;
    if (p.type === 'cover') html = coverCard(S, p, i + 1, total);
    else if (p.type === 'end') html = endCard(S, p, i + 1, total);
    else if (p.type === 'step') html = stepCard(S, p, i + 1, total);
    else html = contentCard(S, p, i + 1, total);
    row.insertAdjacentHTML('beforeend', html);
  });
  stage.appendChild(group);
}

if (allStyles) {
  STYLES.forEach(s => renderAll(s));
} else {
  const S = STYLES.find(s => s.id === styleId) || STYLES[0];
  document.title = S.name + ' · 小红书卡片';
  renderAll(S);
}
</script>
